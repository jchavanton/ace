# Inventory for ace deployments.
#
# ace runs on "client" hosts — boxes that originate test calls into the
# Aizan VXML stack. Separate from the vxml runtime inventory (~/git/aizan/vxml/
# ansible/inventory*.yml) so the two stacks roll independently.
#
# Hostnames come from ~/.ssh/config; no ansible_host needed.

# LAN deployments: source-build voip_patrol from a sibling checkout,
# install to /opt/aizan/ace, root-owned. HTTP Basic Auth enabled.
ace_hosts:
   hosts:
      sbc-ace-client1:
         # Public IP advertised in SIP Contact / Via headers. Empty =
         # let the playbook auto-discover via an external lookup at
         # deploy time. Override here when the host has a known fixed
         # public IP (saves the lookup).
         ace_public_address: ""

   vars:
      ansible_user: julien

      # Where the playbook builds + ships the image from. Defaults to a
      # local checkout in the deployer's home. Need sibling voip_patrol
      # too (used by the Dockerfile's stage-1 build context).
      ace_source_dir:         "{{ lookup('env','HOME') }}/git/ace"
      voip_patrol_source_dir: "{{ lookup('env','HOME') }}/git/voip_patrol"

      # Install dir on the target — compose project lives here.
      ace_install_dir: /opt/aizan/ace

      # Bind addresses for the web UI and SIP. Web UI on 8086 by
      # default; SIP on 5093 to mirror what we use locally. The RTP
      # range is voip_patrol's default (4000-14000); narrow it here if
      # a specific range is required by the SBC / firewall.
      # All three are overridable per-run from the UI — these are just
      # the defaults the form pre-fills.
      ace_http_addr: "0.0.0.0:8086"
      ace_sip_port: 5093
      ace_rtp_port_start: 4000
      ace_rtp_port_end: 14000

      # --- Optional HTTP Basic Auth (LAN-only deployments) ---
      # Flip to true to require Basic Auth on every request. Users are
      # bcrypt-hashed and rendered into an htpasswd file that ace re-reads
      # every 10s, so adding a user only needs a re-run of the playbook —
      # no container restart. Put ace_basic_auth_users in an ansible-vault
      # encrypted group_vars file (do NOT check plaintext hashes into the
      # inventory).
      #
      # Generate a bcrypt hash locally:
      #   htpasswd -nbBC 10 julien 'my-password'
      # then paste the whole "user:$2y$..." line into ace_basic_auth_users.
      ace_auth_enabled: true
      # ace_basic_auth_users lives in group_vars/ace_hosts.yml

# GCP-hosted ACE (single VM, docker + caddy + authelia already installed
# by install-ace.sh). Ansible re-provisions ACE only; caddy + authelia
# stay untouched. The Dockerfile pulls voip_patrol as a prebuilt image,
# so no sibling voip_patrol/ checkout is shipped. Auth is fronted by
# authelia+caddy on the same host, so ACE's own basic-auth is off.
ace_gcp_hosts:
   hosts:
      ace-loadtest-01:
         # Detected once at deploy time by the playbook via the GCP
         # metadata service. Leave empty here so the auto-detection
         # runs; override to pin a specific value.
         ace_public_address: ""
         # Comma-separated list of private IPs to surface in ACE's UI
         # Network dropdown. Auto-filled from GCP metadata; override to pin.
         ace_local_ips: ""

   vars:
      # ~/.ssh/config alias resolves this. Matches other netic-* GCP hosts.
      ansible_user: ext_jchavanton_gmail_com
      # Source-build voip_patrol from the sibling checkout (currently on
      # feat/nameserver-cli). Set to true only when a prebuilt
      # jchavanton/voip_patrol:<tag> matching the ace Dockerfile is
      # available on Docker Hub AND the Dockerfile's stage 1 references it.
      ace_use_prebuilt_voip_patrol: false
      ace_source_dir: "{{ lookup('env','HOME') }}/git/ace"
      # install-ace.sh put the stack under $HOME/ace; keep that so the
      # switch to ansible doesn't require a compose migration.
      ace_install_dir: "/home/{{ ansible_user }}/ace"
      # Cloud tag used by the role to pick metadata-service IP detection.
      ace_cloud: gcp

      ace_http_addr: "0.0.0.0:8086"
      ace_sip_port: 5093
      ace_rtp_port_start: 4000
      ace_rtp_port_end: 14000

      ace_auth_enabled: false

      # Reuse Caddy's Let's Encrypt cert for voip_patrol TLS. Caddy
      # (in the authelia-stack next to ace) renews it automatically;
      # the docker volume path is stable while that stack exists. The
      # cert is issued for ace.netic.ravenrtc.com — fine as a client
      # cert (peer doesn't validate our CN); if we ever need to receive
      # TLS calls under a different SIP identity, swap this for a
      # dedicated cert. Empty ace_tls_host_cert_dir disables the mount.
      ace_tls_host_cert_dir: "/var/lib/docker/volumes/authelia-stack_caddy_data/_data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/ace.netic.ravenrtc.com"
      ace_tls_container_cert_dir: "/tls"
      ace_tls_cert_file: "ace.netic.ravenrtc.com.crt"
      ace_tls_privkey_file: "ace.netic.ravenrtc.com.key"
      ace_basic_auth_users: []
