---
# ace role: install docker (if missing), ship source, build & run.
#
# Two deploy shapes today:
#   - LAN     (ace_hosts):    build voip_patrol from a sibling checkout,
#                             install to /opt/aizan/ace, root-owned.
#   - GCP     (ace_gcp_hosts): use prebuilt jchavanton/voip_patrol image,
#                             install to $HOME/ace under the login user,
#                             sudo for docker/apt only. Auth is fronted by
#                             caddy+authelia on the same host (not managed
#                             here); leave ACE's own basic-auth off.

- name: Install docker prerequisites
  become: true
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - rsync
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

# --- Public / private IP resolution -----------------------------------------
# LAN: leave ACE_PUBLIC_ADDRESS empty unless the inventory pins one — the
# host's NIC IP is the LAN-reachable one, no auto-lookup needed.
# GCP: query the metadata service (from the target host, no auth required)
# for both the external and internal IPs so the UI dropdown offers the
# right options. Inventory pins win over auto-detect either way.
- name: Resolve ace_public_address (inventory override wins)
  ansible.builtin.set_fact:
    ace_public_address_effective: "{{ ace_public_address | default('') }}"

- name: Detect GCP external IP from metadata (when empty in inventory)
  ansible.builtin.uri:
    url: http://metadata.google.internal/computeMetadata/v1/instance/network-interfaces/0/access-configs/0/external-ip
    headers:
      Metadata-Flavor: Google
    return_content: true
  register: gcp_ext_ip
  when:
    - ace_cloud | default('') == 'gcp'
    - ace_public_address_effective == ''

- name: Apply detected GCP external IP
  ansible.builtin.set_fact:
    ace_public_address_effective: "{{ gcp_ext_ip.content | trim }}"
  when:
    - ace_cloud | default('') == 'gcp'
    - ace_public_address_effective == ''
    - gcp_ext_ip is defined
    - gcp_ext_ip.content is defined

- name: Resolve ace_local_ips (inventory override wins)
  ansible.builtin.set_fact:
    ace_local_ips_effective: "{{ ace_local_ips | default('') }}"

- name: Detect GCP internal IP from metadata (when empty in inventory)
  ansible.builtin.uri:
    url: http://metadata.google.internal/computeMetadata/v1/instance/network-interfaces/0/ip
    headers:
      Metadata-Flavor: Google
    return_content: true
  register: gcp_int_ip
  when:
    - ace_cloud | default('') == 'gcp'
    - ace_local_ips_effective == ''

- name: Apply detected GCP internal IP
  ansible.builtin.set_fact:
    ace_local_ips_effective: "{{ gcp_int_ip.content | trim }}"
  when:
    - ace_cloud | default('') == 'gcp'
    - ace_local_ips_effective == ''
    - gcp_int_ip is defined
    - gcp_int_ip.content is defined

# Basic auth is enforced by ace itself, so no bind-address rewrite is
# needed — the same 0.0.0.0:8086 listener now requires credentials.
- name: Resolve ace bind address
  ansible.builtin.set_fact:
    ace_http_addr_effective: "{{ ace_http_addr }}"

- name: Validate auth vars when auth enabled
  ansible.builtin.assert:
    that:
      - ace_basic_auth_users | length > 0
    fail_msg: >-
      ace_auth_enabled=true but ace_basic_auth_users is empty. Add at
      least one "user:$2y$..." line (bcrypt) to the vault-encrypted
      group_vars file.
  when: ace_auth_enabled | default(false)

# --- Install dir + source ---------------------------------------------------
# LAN: /opt/aizan/ace owned by root (become: true).
# GCP: $HOME/ace owned by the login user (no become needed for the dir).
- name: Ensure install dir exists
  become: true
  ansible.builtin.file:
    path: "{{ ace_install_dir }}"
    state: directory
    owner: "{{ 'root' if ace_cloud | default('') != 'gcp' else ansible_user }}"
    group: "{{ 'root' if ace_cloud | default('') != 'gcp' else ansible_user }}"
    mode: '0755'

# Source code → target. Use rsync (synchronize module) so re-deploys
# only ship the delta. The build context for ace is the install dir.
# LAN install dir is root-owned; become: true makes synchronize pass
# --rsync-path='sudo -u root rsync' so the remote rsync runs as root.
# GCP dir is user-owned so no escalation needed.
- name: Ship ace source to host
  become: "{{ ace_cloud | default('') != 'gcp' }}"
  ansible.posix.synchronize:
    src: "{{ ace_source_dir }}/"
    dest: "{{ ace_install_dir }}/"
    delete: false              # preserve runs/ and scenarios/ on the host
    recursive: true
    rsync_opts:
      - "--exclude=runs/*"
      - "--exclude=scenarios/*"   # operator's scenarios stay sovereign
      - "--exclude=bots/*"        # per-host bot schedules + alerts stay sovereign
      - "--exclude=firewall/*"    # root-owned runtime state (container writes as root)
      - "--exclude=.git"
      - "--exclude=ace"           # built binary; the image rebuild does its own
      - "--exclude=ansible"       # don't ship the playbook into the build context
      # Container writes root-owned files into bind-mounted dirs
      # (firewall/, runs/, scenarios/). --archive would try to utime()
      # those dirs and fail as the non-root SSH user; skip dir times.
      - "--omit-dir-times"
    times: true

# Only ship voip_patrol source when the target is going to build it —
# GCP uses the prebuilt jchavanton/voip_patrol image (Dockerfile stage 1
# already `FROM jchavanton/voip_patrol:0.10.1`), so the sibling
# checkout isn't needed there.
- name: Ship voip_patrol source to host
  when: not (ace_use_prebuilt_voip_patrol | default(false))
  become: "{{ ace_cloud | default('') != 'gcp' }}"
  ansible.posix.synchronize:
    src: "{{ voip_patrol_source_dir }}/"
    dest: "{{ ace_install_dir }}/../voip_patrol/"
    delete: true                # keep this checkout pristine
    recursive: true
    # Anchor excludes to the root with a leading slash. Bare names match
    # at any depth — `Makefile` alone would also exclude
    # pjproject/Makefile which is TRACKED source we need for the build.
    rsync_opts:
      - "--exclude=/.git"
      - "--exclude=/CMakeCache.txt"
      - "--exclude=/CMakeFiles"
      - "--exclude=/Makefile"              # CMake-generated; NOT pjproject/Makefile
      - "--exclude=/cmake_install.cmake"
      - "--exclude=/voip_patrol"           # built binary
      - "--exclude=pjproject/build.mak"    # configure-generated
      - "--exclude=pjproject/**/output"    # build outputs per module
    times: true

# When the Dockerfile pulls a prebuilt voip_patrol image, the compose
# file's additional_contexts.voip_patrol pointer to ../voip_patrol is
# dead weight — but docker refuses to build with a missing context. Strip
# the additional_contexts block from the shipped docker-compose.yml (same
# transformation install-ace.sh performs).
- name: Strip additional_contexts from docker-compose.yml (prebuilt path)
  when: ace_use_prebuilt_voip_patrol | default(false)
  ansible.builtin.replace:
    path: "{{ ace_install_dir }}/docker-compose.yml"
    regexp: '^(\s*)additional_contexts:\s*\n((\1\s+.*\n)|(\s*#.*\n)|(\s*\n))*'
    replace: ''

# TLS cert bind-mount. When ace_tls_host_cert_dir is set on the host,
# render a docker-compose.override.yml that mounts that dir read-only
# into the ace container. The env vars in .env then point ace at the
# cert/key files inside that mount. Absent = remove any stale override
# so a previous TLS setup doesn't leak into a de-configured host.
- name: Render docker-compose.override.yml (TLS mount)
  become: true
  ansible.builtin.template:
    src: docker-compose.override.yml.j2
    dest: "{{ ace_install_dir }}/docker-compose.override.yml"
    owner: "{{ 'root' if ace_cloud | default('') != 'gcp' else ansible_user }}"
    group: "{{ 'root' if ace_cloud | default('') != 'gcp' else ansible_user }}"
    mode: '0644'
  when: ace_tls_host_cert_dir | default('') != ''
  notify: restart ace

- name: Remove docker-compose.override.yml when TLS not configured
  become: true
  ansible.builtin.file:
    path: "{{ ace_install_dir }}/docker-compose.override.yml"
    state: absent
  when: ace_tls_host_cert_dir | default('') == ''
  notify: restart ace

# Per-host overrides for the compose stack. The .env file is the only
# place a deployer should need to set values; the compose file itself
# reads them with ${VAR:-default} so changes don't require editing it.
- name: Render compose .env
  become: true
  ansible.builtin.template:
    src: ace.env.j2
    dest: "{{ ace_install_dir }}/.env"
    owner: "{{ 'root' if ace_cloud | default('') != 'gcp' else ansible_user }}"
    group: "{{ 'root' if ace_cloud | default('') != 'gcp' else ansible_user }}"
    mode: '0644'
  notify: restart ace

# Host data dirs. scenarios/ stays operator-managed (we don't
# overwrite). runs/ accumulates run history.
- name: Ensure scenarios dir exists
  become: true
  ansible.builtin.file:
    path: "{{ ace_install_dir }}/scenarios"
    state: directory
    owner: "{{ 'root' if ace_cloud | default('') != 'gcp' else ansible_user }}"
    group: "{{ 'root' if ace_cloud | default('') != 'gcp' else ansible_user }}"
    mode: '0755'

- name: Ensure runs dir exists
  become: true
  ansible.builtin.file:
    path: "{{ ace_install_dir }}/runs"
    state: directory
    owner: "{{ 'root' if ace_cloud | default('') != 'gcp' else ansible_user }}"
    group: "{{ 'root' if ace_cloud | default('') != 'gcp' else ansible_user }}"
    mode: '0755'

- name: Ensure bots dir exists
  become: true
  ansible.builtin.file:
    path: "{{ ace_install_dir }}/bots"
    state: directory
    owner: "{{ 'root' if ace_cloud | default('') != 'gcp' else ansible_user }}"
    group: "{{ 'root' if ace_cloud | default('') != 'gcp' else ansible_user }}"
    mode: '0755'

# Auth dir always exists — the compose bind-mount references it whether
# auth is on or off, and docker won't create the source dir for you.
- name: Ensure auth dir exists
  become: true
  ansible.builtin.file:
    path: "{{ ace_install_dir }}/auth"
    state: directory
    owner: "{{ 'root' if ace_cloud | default('') != 'gcp' else ansible_user }}"
    group: "{{ 'root' if ace_cloud | default('') != 'gcp' else ansible_user }}"
    mode: '0750'

- name: Render htpasswd
  become: true
  ansible.builtin.template:
    src: htpasswd.j2
    dest: "{{ ace_install_dir }}/auth/htpasswd"
    owner: "{{ 'root' if ace_cloud | default('') != 'gcp' else ansible_user }}"
    group: "{{ 'root' if ace_cloud | default('') != 'gcp' else ansible_user }}"
    mode: '0640'
  when: ace_auth_enabled | default(false)
  # No restart needed — ace re-reads the file every 10s. The compose
  # restart from .env changes is enough for the ACE_BASIC_AUTH_HTPASSWD
  # env var to take effect on first enable.

# `docker compose up -d --build` is the single source of truth. The
# --build flag re-runs the image build only when the Dockerfile / source
# changed; otherwise it's a fast no-op. changed_when keys off compose's
# output so ansible's reporting reflects what actually happened. Docker
# on the GCP host requires sudo (login user isn't in the docker group).
- name: docker compose up
  become: true
  ansible.builtin.command:
    cmd: docker compose up -d --build
    chdir: "{{ ace_install_dir }}"
  environment:
    # docker compose reads .env from cwd, but explicitly pass the
    # variables through so `sudo` doesn't strip them.
    ACE_ADDR: "{{ ace_http_addr_effective }}"
    ACE_VOIP_PATROL_PORT: "{{ ace_sip_port | string }}"
    ACE_RTP_PORT_START: "{{ ace_rtp_port_start | string }}"
    ACE_RTP_PORT_END: "{{ ace_rtp_port_end | string }}"
    ACE_PUBLIC_ADDRESS: "{{ ace_public_address_effective }}"
    ACE_LOCAL_IPS: "{{ ace_local_ips_effective | default('') }}"
    ACE_BASIC_AUTH_HTPASSWD: "{{ '/data/auth/htpasswd' if ace_auth_enabled | default(false) else '' }}"
  register: compose_up
  changed_when: >
    'Started' in compose_up.stderr or
    'Created' in compose_up.stderr or
    'Recreated' in compose_up.stderr or
    'Built' in compose_up.stderr

# Health check accepts 200 (auth off) or 401 (auth on, no creds sent) —
# both mean ace is up and serving. 401 with a valid WWW-Authenticate
# header is the correct response when the middleware is active.
- name: Wait for ace HTTP to come up
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ ace_http_addr_effective | regex_replace('^.*:', '') }}/scenarios"
    status_code: [200, 401]
  register: ace_health
  until: ace_health.status in [200, 401]
  retries: 12
  delay: 5

- name: Show ace URL
  ansible.builtin.debug:
    msg: >-
      {{ 'ace is up — http://' ~ inventory_hostname ~ ':' ~ (ace_http_addr | regex_replace('^.*:', '')) ~ '/'
         ~ (' (auth: HTTP Basic)' if ace_auth_enabled | default(false) else '') }}
