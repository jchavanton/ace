# ace + voip_patrol in one container, host networking.
#
# Host networking means voip_patrol's SIP/RTP sockets are visible on
# the host's interface directly — no port translation, no docker NAT
# fighting with carrier NAT. ace listens on whatever ACE_ADDR sets,
# typically :8086.
#
# scenarios/ and runs/ are bind-mounted so an operator can drop XML
# files into ./scenarios/ on the host and see them appear in the UI,
# and inspect captured WAVs under ./runs/ without entering the container.
#
# Build:   docker compose build
# Run:     docker compose up -d
# Tail:    docker compose logs -f
# Stop:    docker compose down

services:
  ace:
    image: ace:0.1.0
    container_name: ace
    build:
      context: .
      additional_contexts:
        # Bring the voip_patrol source tree in as a build context (read-only).
        # The Dockerfile's stage 1 does `COPY voip_patrol /git/voip_patrol`,
        # which resolves to this dir at build time.
        voip_patrol: ../voip_patrol
      dockerfile: Dockerfile
    network_mode: host
    restart: unless-stopped
    environment:
      # Values come from .env (rendered by ansible on deploy) or fall
      # back to these defaults for a hand-launched local stack.
      ACE_ADDR: "${ACE_ADDR:-0.0.0.0:8086}"
      ACE_VOIP_PATROL_PORT: "${ACE_VOIP_PATROL_PORT:-5093}"
      ACE_RTP_PORT_START: "${ACE_RTP_PORT_START:-4000}"
      ACE_RTP_PORT_END: "${ACE_RTP_PORT_END:-14000}"
      # Set this to the host's public IP when behind NAT. Empty = let
      # PJSIP use whatever interface it bound to. With network_mode: host
      # the binding is on the host's real IP, so on a host with a public
      # IP this can stay empty.
      ACE_PUBLIC_ADDRESS: "${ACE_PUBLIC_ADDRESS:-}"
      # Comma-separated private IPs surfaced in ACE's UI Network dropdown,
      # overriding in-container interface enumeration. Needed on cloud VMs
      # where the container's veth (172.x) isn't the address to advertise.
      ACE_LOCAL_IPS: "${ACE_LOCAL_IPS:-}"
      # Path to the htpasswd file (bcrypt-hashed) *inside the container*.
      # Empty = no auth. Ansible renders the file to ./auth/htpasswd on
      # the host and sets ACE_BASIC_AUTH_HTPASSWD=/data/auth/htpasswd in
      # .env when ace_auth_enabled=true.
      ACE_BASIC_AUTH_HTPASSWD: "${ACE_BASIC_AUTH_HTPASSWD:-}"
    volumes:
      - ./scenarios:/data/scenarios:rw
      - ./runs:/data/runs:rw
      # Bind-mount ./auth as read-only. Present-but-empty when auth is
      # off; ace only reads the file when ACE_BASIC_AUTH_HTPASSWD is set.
      - ./auth:/data/auth:ro
