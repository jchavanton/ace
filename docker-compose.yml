# ace + voip_patrol in one container, host networking.
#
# Host networking means voip_patrol's SIP/RTP sockets are visible on
# the host's interface directly — no port translation, no docker NAT
# fighting with carrier NAT. ace listens on whatever ACE_ADDR sets,
# typically :8086.
#
# scenarios/ and runs/ are bind-mounted so an operator can drop XML
# files into ./scenarios/ on the host and see them appear in the UI,
# and inspect captured WAVs under ./runs/ without entering the container.
#
# Build:   docker compose build
# Run:     docker compose up -d
# Tail:    docker compose logs -f
# Stop:    docker compose down

services:
  ace:
    image: ace:0.1.0
    container_name: ace
    build:
      context: .
      additional_contexts:
        # Bring the voip_patrol source tree in as a build context (read-only).
        # The Dockerfile's stage 1 does `COPY voip_patrol /git/voip_patrol`,
        # which resolves to this dir at build time.
        voip_patrol: ../voip_patrol
      dockerfile: Dockerfile
    network_mode: host
    # NET_ADMIN lets ace program the host's iptables from the /firewall
    # page. Host networking already puts us in the host's network
    # namespace; this cap unlocks the syscalls iptables needs.
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    environment:
      # Values come from .env (rendered by ansible on deploy) or fall
      # back to these defaults for a hand-launched local stack.
      ACE_ADDR: "${ACE_ADDR:-0.0.0.0:8086}"
      ACE_VOIP_PATROL_PORT: "${ACE_VOIP_PATROL_PORT:-5093}"
      ACE_RTP_PORT_START: "${ACE_RTP_PORT_START:-4000}"
      ACE_RTP_PORT_END: "${ACE_RTP_PORT_END:-14000}"
      # Set this to the host's public IP when behind NAT. Empty = let
      # PJSIP use whatever interface it bound to. With network_mode: host
      # the binding is on the host's real IP, so on a host with a public
      # IP this can stay empty.
      ACE_PUBLIC_ADDRESS: "${ACE_PUBLIC_ADDRESS:-}"
      # Comma-separated private IPs surfaced in ACE's UI Network dropdown,
      # overriding in-container interface enumeration. Needed on cloud VMs
      # where the container's veth (172.x) isn't the address to advertise.
      ACE_LOCAL_IPS: "${ACE_LOCAL_IPS:-}"
      # Path to the htpasswd file (bcrypt-hashed) *inside the container*.
      # Empty = no auth. Ansible renders the file to ./auth/htpasswd on
      # the host and sets ACE_BASIC_AUTH_HTPASSWD=/data/auth/htpasswd in
      # .env when ace_auth_enabled=true.
      ACE_BASIC_AUTH_HTPASSWD: "${ACE_BASIC_AUTH_HTPASSWD:-}"
      # When set, iptables state is dumped here after each Apply so it
      # survives a host reboot (needs iptables-persistent on the host).
      # Empty = runtime-only; the /firewall page still works, but a
      # host reboot loses the chain contents.
      ACE_FIREWALL_SAVE_PATH: "${ACE_FIREWALL_SAVE_PATH:-}"
      # TLS material passed to voip_patrol on every run (used only when
      # a scenario picks transport="tls"). Absolute paths *inside the
      # container*; typically mounted read-only from the host's caddy
      # cert dir. Empty = no TLS flags passed and TLS scenarios will
      # fail at handshake.
      ACE_TLS_CERT:    "${ACE_TLS_CERT:-}"
      ACE_TLS_PRIVKEY: "${ACE_TLS_PRIVKEY:-}"
      ACE_TLS_CALIST:  "${ACE_TLS_CALIST:-}"
      # Externally-visible URL prefix used in alert email bodies so
      # recipients can click through to the run detail page. Empty = no
      # link in the email (run ID still shown as text).
      ACE_PUBLIC_BASE_URL: "${ACE_PUBLIC_BASE_URL:-}"
      # Base URL of the prometheus sidecar (below). Empty disables the
      # /bots/:name/report chart panels — /metrics itself still exports,
      # so a downstream prometheus can scrape ace even without this set.
      ACE_PROMETHEUS_URL: "${ACE_PROMETHEUS_URL:-http://localhost:9090}"
      # Webhook destination for per-call and run.finished events.
      # Typical value with host networking: http://127.0.0.1:8090/webhook
      # (the ace_bridge process listens on the host). Empty disables webhooks.
      ACE_WEBHOOK_URL: "${ACE_WEBHOOK_URL:-}"
      # Optional HMAC-SHA256 secret for X-Ace-Signature on outbound
      # webhook POSTs. Must match the bridge's -webhook-secret. Empty
      # = no signature header.
      ACE_WEBHOOK_SECRET: "${ACE_WEBHOOK_SECRET:-}"
      # Optional per-POST timeout, e.g. "5s". Empty defaults to 5s.
      ACE_WEBHOOK_TIMEOUT: "${ACE_WEBHOOK_TIMEOUT:-}"
    volumes:
      - ./scenarios:/data/scenarios:rw
      - ./runs:/data/runs:rw
      # Bots + alerts.json persist here so schedules survive container
      # restarts. ace creates <name>.json + alerts.json on demand.
      - ./bots:/data/bots:rw
      # Bind-mount ./auth as read-only. Present-but-empty when auth is
      # off; ace only reads the file when ACE_BASIC_AUTH_HTPASSWD is set.
      - ./auth:/data/auth:ro
      # Persists firewall.json across container restarts. The file is
      # loaded and applied at startup so the operator's allow-list
      # survives a `docker compose up -d` cycle.
      - ./firewall:/data/firewall:rw

  # Prometheus scrapes ace on localhost (host networking) and stores
  # 90d of samples in a named volume so a `docker compose down` keeps
  # history. The /bots/:name/report page queries it via the ace
  # backend at ACE_PROMETHEUS_URL — no browser-to-prometheus traffic,
  # so the port doesn't need to be exposed off-host.
  prometheus:
    image: prom/prometheus:latest
    container_name: ace-prometheus
    network_mode: host
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--web.listen-address=127.0.0.1:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  # node_exporter publishes host-level CPU/memory/disk/network metrics
  # that the /monitoring page queries via Prometheus. Bound to localhost
  # only (host networking) so the raw endpoint isn't exposed off-host —
  # ace is the only consumer, through the sidecar prometheus.
  node-exporter:
    image: prom/node-exporter:latest
    container_name: ace-node-exporter
    network_mode: host
    restart: unless-stopped
    pid: host
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host/root'
      - '--web.listen-address=127.0.0.1:9100'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|run/docker/.+)($$|/)'
      - '--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$'
    volumes:
      - '/proc:/host/proc:ro'
      - '/sys:/host/sys:ro'
      - '/:/host/root:ro,rslave'
    mem_limit: 100M
    mem_reservation: 20M

volumes:
  prometheus_data:
