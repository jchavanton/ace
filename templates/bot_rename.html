{{ define "content_bot_rename" }}
<nav aria-label="breadcrumb"><ol class="breadcrumb small">
  <li class="breadcrumb-item"><a href="/bots">Bots</a></li>
  <li class="breadcrumb-item active">rename {{ .Bot.Name }}</li>
</ol></nav>

<h1 class="h3 mb-3">Rename bot</h1>

<form method="post" action="/bots/{{ .Bot.Name }}/rename" class="col-md-6">
  <div class="mb-3">
    <label class="form-label small">Current name</label>
    <input class="form-control form-control-sm font-monospace" value="{{ .Bot.Name }}" disabled>
  </div>
  <div class="mb-3">
    <label class="form-label small">New name</label>
    <input name="new_name" required pattern="[A-Za-z0-9_-]+" maxlength="64"
           value="{{ .Bot.Name }}"
           class="form-control form-control-sm font-monospace" autofocus>
    <div class="form-text small">Letters, digits, <code>_</code> and <code>-</code> only.</div>
  </div>
  <p class="small text-muted">
    Historical runs and alerts keep the old name. The bot report chart repopulates under the new name as new runs fire.
  </p>
  <div class="d-flex gap-2">
    <button class="btn btn-sm btn-primary">Rename</button>
    <a href="/bots" class="btn btn-sm btn-outline-secondary">Cancel</a>
  </div>
</form>
{{ end }}
