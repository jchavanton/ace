{{ define "content_scenario_detail" }}
<nav aria-label="breadcrumb"><ol class="breadcrumb small">
  <li class="breadcrumb-item"><a href="/scenarios">Scenarios</a></li>
  <li class="breadcrumb-item active">{{ .Scenario.Name }}</li>
</ol></nav>

<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">{{ .Scenario.Name }}</h1>
  <div>
    <button type="button" class="btn btn-outline-secondary" onclick="document.getElementById('save-form').requestSubmit()">Save</button>
    <form method="post" action="/scenarios/{{ .Scenario.Name }}/run" class="d-inline">
      <button type="submit" class="btn btn-primary" {{ if .Busy }}disabled{{ end }}>Run scenario</button>
    </form>
  </div>
</div>

<p class="small text-muted">
  <code>{{ .Scenario.Path }}</code>
  · {{ .Scenario.SizeBytes }} B
  · modified {{ .Scenario.ModTime.Format "2006-01-02 15:04:05" }}
</p>

<form method="post" action="/scenarios/{{ .Scenario.Name }}" id="save-form">
  <textarea name="xml" id="xml-editor" class="form-control" style="font-family:monospace; min-height:60vh;">{{ .XML }}</textarea>
</form>

<!-- CodeMirror 5 from CDN: light, no build step. Replaces the textarea
     with a syntax-highlighted XML editor; the underlying <textarea> stays
     synced so the form submit gets the edited content automatically. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/eclipse.css">
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/xml/xml.js"></script>
<script>
  (function () {
    const ta = document.getElementById('xml-editor');
    const cm = CodeMirror.fromTextArea(ta, {
      mode: 'application/xml',
      theme: 'eclipse',
      lineNumbers: true,
      indentUnit: 2,
      lineWrapping: true,
    });
    cm.setSize(null, '60vh');
    // Ctrl/Cmd+S → Save
    cm.setOption('extraKeys', {
      'Ctrl-S': function () { document.getElementById('save-form').requestSubmit(); },
      'Cmd-S':  function () { document.getElementById('save-form').requestSubmit(); },
    });
  })();
</script>
{{ end }}
